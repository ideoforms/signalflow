#--------------------------------------------------------------------------------
# Build wheels, and publish releases.
#
# Pushing a version tag (e.g. v0.5.6) runs the full release process:
#  - build and test Linux wheels (x86_64 and aarch64)
#  - create a draft GitHub release, with the wheels attached and release notes
#    taken from the corresponding CHANGELOG.md entry
#  - publish to PyPI, after approval via the `pypi` environment
#  - publish the GitHub release
#
# Tags with a pre-release suffix (e.g. v0.6.0rc1) are marked as pre-releases on
# GitHub, and treated as pre-releases by pip.
#
# Running the workflow manually (workflow_dispatch) only builds and tests wheels.
# macOS wheels are currently built manually; see CONTRIBUTING.md.
#--------------------------------------------------------------------------------

name: Build wheels

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Linux x86_64 and aarch64 (e.g. 64-bit Raspberry Pi OS), and Windows x64,
        # all built natively.
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check that tag matches version in pyproject.toml
        if: github.event_name == 'push'
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          SETUP_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$TAG_VERSION" != "$SETUP_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $SETUP_VERSION in pyproject.toml"
            exit 1
          fi

      #--------------------------------------------------------------------------------
      # Windows dependencies. CMakeLists.txt expects these in the directory above
      # the project directory.
      #  - libsndfile: official Windows build, which includes FLAC, Ogg, Opus and MP3
      #  - FFTW: official Windows DLLs. These do not include .lib import libraries,
      #    which must be generated from the .def files with lib.exe.
      # Downloads are verified against known checksums.
      #--------------------------------------------------------------------------------
      - name: Download Windows dependencies
        if: runner.os == 'Windows'
        shell: bash
        run: |
          DEPS_DIR="$GITHUB_WORKSPACE/.."
          curl -sSfL -o sndfile.zip https://github.com/libsndfile/libsndfile/releases/download/1.2.2/libsndfile-1.2.2-win64.zip
          echo "2173935c0c1ed13cf627951d34483f9d405ead2eb473190461c42ba220643a3f  sndfile.zip" | sha256sum -c
          unzip -q sndfile.zip -d "$DEPS_DIR"
          curl -sSfL -o fftw.zip https://fftw.org/pub/fftw/fftw-3.3.5-dll64.zip
          echo "cfd88dc0e8d7001115ea79e069a2c695d52c8947f5b4f3b7ac54a192756f439f  fftw.zip" | sha256sum -c
          unzip -q fftw.zip -d "$DEPS_DIR/fftw-3.3.5-dll64"
          rm sndfile.zip fftw.zip
          curl -sSfL https://raw.githubusercontent.com/mackron/miniaudio/refs/heads/dev-0.12/miniaudio.h -o source/include/signalflow/node/io/output/miniaudio-library.h

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64

      - name: Generate FFTW import libraries
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: ${{ github.workspace }}/../fftw-3.3.5-dll64
        run: |
          lib /nologo /machine:x64 /def:libfftw3-3.def || exit /b 1
          lib /nologo /machine:x64 /def:libfftw3f-3.def || exit /b 1
          lib /nologo /machine:x64 /def:libfftw3l-3.def || exit /b 1
          dir *.lib

      #--------------------------------------------------------------------------------
      # zlib is required by libmysofa. The static-md triplet builds a static library
      # (so there is no DLL to bundle) against the dynamic C runtime, matching the
      # rest of the build. CMAKE_PREFIX_PATH is used by find_package(ZLIB).
      #--------------------------------------------------------------------------------
      - name: Install zlib
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install zlib:x64-windows-static-md
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "CMAKE_PREFIX_PATH=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==4.3.1

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          #--------------------------------------------------------------------------------
          # Build all CPython versions permitted by requires-python in pyproject.toml,
          # for the runner's native architecture.
          # Free-threaded builds are skipped, as SignalFlow has not been verified as
          # safe to run without the GIL.
          #--------------------------------------------------------------------------------
          CIBW_BUILD: cp3*-manylinux_* cp3*-win_amd64
          CIBW_SKIP: cp3??t-*
          CIBW_ARCHS_LINUX: native
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_BUILD_VERBOSITY: 1

          #--------------------------------------------------------------------------------
          # Linux wheels are built in the manylinux_2_28 image (AlmaLinux 8).
          #  - fftw and alsa are available as system packages
          #  - codec libraries are installed so that libsndfile supports FLAC, Ogg Vorbis,
          #    Opus and MP3 (some of which are in the powertools repo); these are
          #    bundled into the wheel by auditwheel
          #  - libsndfile is built from source, as the system package (1.0.28) is outdated.
          #    CMAKE_POLICY_VERSION_MINIMUM is required as libsndfile 1.2.2 declares
          #    compatibility with CMake < 3.5, which CMake 4 no longer supports.
          #  - JACK and ALSA are loaded by miniaudio at runtime, so are not linked here
          #--------------------------------------------------------------------------------
          CIBW_BEFORE_ALL_LINUX: >
             yum install -y --enablerepo=powertools fftw-devel alsa-lib-devel flac-devel libogg-devel libvorbis-devel opus-devel lame-devel mpg123-devel &&
             git clone --depth 1 --branch 1.2.2 https://github.com/libsndfile/libsndfile.git /tmp/libsndfile &&
             cmake -S /tmp/libsndfile -B /tmp/libsndfile/build -DBUILD_SHARED_LIBS=1 -DBUILD_PROGRAMS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_TESTING=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5 &&
             cmake --build /tmp/libsndfile/build -j4 &&
             cmake --install /tmp/libsndfile/build &&
             curl https://raw.githubusercontent.com/mackron/miniaudio/refs/heads/dev-0.12/miniaudio.h -o source/include/signalflow/node/io/output/miniaudio-library.h
          CIBW_ENVIRONMENT_LINUX: LD_LIBRARY_PATH=/usr/local/lib64:/usr/local/lib:$LD_LIBRARY_PATH

          #--------------------------------------------------------------------------------
          # Windows wheels bundle the libsndfile and FFTW DLLs using delvewheel.
          #--------------------------------------------------------------------------------
          CIBW_BEFORE_BUILD_WINDOWS: pip install delvewheel
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >
             delvewheel repair -v
             --add-path "${{ github.workspace }}\..\libsndfile-1.2.2-win64\bin;${{ github.workspace }}\..\fftw-3.3.5-dll64"
             -w {dest_dir} {wheel}

          #--------------------------------------------------------------------------------
          # Run the test suite against each built wheel. Tests are run from the project
          # directory, as some tests load audio files via relative paths. First, verify
          # that signalflow is imported from the installed wheel, rather than from the
          # build directory within the project.
          #--------------------------------------------------------------------------------
          CIBW_TEST_GROUPS: test
          CIBW_TEST_COMMAND: >
             cd {project} &&
             python -c "import signalflow; print('Testing', signalflow.__file__); assert 'site-packages' in signalflow.__file__" &&
             python -m pytest tests
          # On Windows, `cd /d` is needed in case the project is on a different drive
          CIBW_TEST_COMMAND_WINDOWS: >
             cd /d {project} &&
             python -c "import signalflow; print('Testing', signalflow.__file__); assert 'site-packages' in signalflow.__file__" &&
             python -m pytest tests

      #--------------------------------------------------------------------------------
      # Check that each wheel includes the type stubs (see CONTRIBUTING.md), which
      # are generated by pybind11-stubgen and committed to the repo.
      #--------------------------------------------------------------------------------
      - name: Check wheels include type stubs
        shell: bash
        run: |
          python - <<'EOF'
          import glob, sys, zipfile
          wheels = glob.glob("wheelhouse/*.whl")
          required = ["signalflow-stubs/__init__.pyi", "signalflow-stubs/signalflow.pyi"]
          missing = [(w, f) for w in wheels for f in required if f not in zipfile.ZipFile(w).namelist()]
          for wheel, filename in missing:
              print("::error::%s is missing %s" % (wheel, filename))
          print("Checked %d wheels" % len(wheels))
          sys.exit(1 if missing or not wheels else 0)
          EOF

      #--------------------------------------------------------------------------------
      # Previously, Windows wheels were sometimes mislabelled as win32. Fail if any
      # wheel does not have the expected platform tag.
      #--------------------------------------------------------------------------------
      - name: Check Windows wheel platform tags
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ls wheelhouse/*.whl
          if ls wheelhouse/*.whl | grep -v -- '-win_amd64\.whl$'; then
            echo "::error::Found wheels without win_amd64 platform tag"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  github_release:
    name: Create draft GitHub release
    needs: build_wheels
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Extract release notes from CHANGELOG.md
        run: |
          # Take the lines between a version's heading and the next heading
          extract_notes() {
            awk -v tag="[$1]" '
              /^## / { if (found) exit; if (index($0, tag)) { found = 1; next } }
              found { print }
            ' CHANGELOG.md
          }
          extract_notes "$GITHUB_REF_NAME" > notes.md

          # For pre-release tags (e.g. v0.6.0rc1), fall back to the notes for the
          # corresponding release (v0.6.0), so that each release candidate does not
          # need its own CHANGELOG entry.
          if ! grep -q '[^[:space:]]' notes.md; then
            BASE_TAG=$(echo "$GITHUB_REF_NAME" | sed -E 's/(a|b|rc|dev)[0-9]+$//')
            extract_notes "$BASE_TAG" > notes.md
          fi

          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::No entry found for $GITHUB_REF_NAME in CHANGELOG.md"
            exit 1
          fi
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create draft release
        run: |
          PRERELEASE=""
          if [[ "$GITHUB_REF_NAME" =~ (a|b|rc|dev)[0-9]+$ ]]; then
            PRERELEASE="--prerelease"
          fi
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # Release already exists (e.g. workflow re-run): update notes and wheels
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
            gh release upload "$GITHUB_REF_NAME" dist/*.whl --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.whl --draft $PRERELEASE \
              --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
          fi

  publish_pypi:
    name: Publish to PyPI
    needs: github_release
    runs-on: ubuntu-24.04
    #--------------------------------------------------------------------------------
    # The `pypi` environment requires approval before this job runs. PyPI trusted
    # publishing is configured to only accept uploads from this environment.
    #--------------------------------------------------------------------------------
    environment:
      name: pypi
      url: https://pypi.org/project/signalflow/
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  publish_github_release:
    name: Publish GitHub release
    needs: publish_pypi
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Publish draft release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
