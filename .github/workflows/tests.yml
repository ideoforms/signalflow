name: tests

on: push

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        sudo rm -rf /home/linuxbrew
        sudo apt-get update -y
        sudo apt-get install libasound2-dev libsndfile1-dev libfftw3-dev -y
        # Requires pip >= 25.1 to install dependency groups (--group)
        python -m pip install -U pip
        curl https://raw.githubusercontent.com/mackron/miniaudio/refs/heads/dev-0.12/miniaudio.h -o source/include/signalflow/node/io/output/miniaudio-library.h
    - name: Configure
      run: mkdir build && cd build && cmake ..
    - name: Make
      run: cd build && make -j8
    - name: Python build
      run: python -m pip install .
    - name: Install test dependencies
      run: python -m pip install --group test
    - name: Python test
      run: python -m pytest
